<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad API REST - Rick and Morty</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

   <!-- CSS Personalizado -->
        <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container my-5">

        <!-- ==========================================
             TÍTULO
        =========================================== -->

        <div class="text-center mb-5">

            <h1 class="display-5">
                Consumo API REST
            </h1>

            <h2 class="text-primary">
                Rick and Morty
            </h2>

            <p class="text-muted">
                Primeros 10 personajes de la API
            </p>

        </div>

        <!-- ==========================================
             BOTONES
        =========================================== -->

        <div class="row mb-4">

            <div class="col-md-6 mb-2">

                <button
                    id="btnObtener"
                    class="btn btn-primary w-100">

                    Obtener Personajes

                </button>

            </div>

            <div class="col-md-6 mb-2">

                <button
                    id="btnAgrupar"
                    class="btn btn-success w-100">

                    Agrupar por Especie

                </button>

            </div>

        </div>

        <!-- ==========================================
             TABLA PERSONAJES
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-dark text-white">

                Lista de Personajes

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Especie</th>

                            </tr>

                        </thead>

                        <tbody id="tablaPersonajes">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- ==========================================
             AGRUPACIÓN
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-success text-white">

                Personajes Agrupados por Especie

            </div>

            <div class="card-body">

                <div id="resultadoAgrupacion">

                </div>

            </div>

        </div>

        <!-- ==========================================
             SELECCIÓN PERSONAJE
        =========================================== -->

        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">

                Seleccionar Personaje

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-9">

                        <select
                            id="selectPersonaje"
                            class="form-select"
                            aria-label="Seleccione un personaje">

                            <option value="">
                                Seleccione un personaje...
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <button
                            id="btnFicha"
                            class="btn btn-warning w-100">

                            Mostrar Ficha

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- ==========================================
             FICHA PERSONAJE
        =========================================== -->

        <div id="contenedorFicha">

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="assets/js/app.js"></script>

</body>

</html>
