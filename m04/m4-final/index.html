<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluación Módulo 4 - UserManager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            margin: 30px;
            color: #1e2a3a;
        }
        h1 {
            color: #0b3b5c;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            background: #1e5f8e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 0 auto;
        }
        button:hover {
            background: #13416b;
            transform: scale(1.02);
        }
        button:disabled {
            background: #8a9ba8;
            cursor: not-allowed;
            transform: none;
        }
        #output {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            border: 1px solid #d0d7de;
        }
        .cargando {
            color: #1e5f8e;
            font-weight: bold;
        }
        .error {
            color: #b22222;
        }
        .exito {
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧑‍💼 Evaluación Módulo 4 - UserManager</h1>
        <p>Administración de usuarios desde <strong>JSONPlaceholder</strong> (XMLHttpRequest)</p>

        <div class="botones">
            <button id="btnListarNombres">📋 Listar nombres</button>
            <button id="btnBuscarUsuario">🔍 Buscar usuario (username + email)</button>
            <button id="btnDireccion">📍 Dirección del usuario</button>
            <button id="btnInfoAvanzada">📊 Info avanzada</button>
            <button id="btnCompanias">🏢 Compañías + frase</button>
            <button id="btnOrdenados">🔤 Nombres ordenados</button>
        </div>

        <div id="output">⏳ Cargando datos desde la API...</div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="app.js" defer></script>
</body>
</html>
