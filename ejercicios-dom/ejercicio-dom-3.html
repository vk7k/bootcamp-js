<!DOCTYPE html>
<html>
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio DOM 3</title>
</head>
<body>
    <!-- Formuario con dos números. presionar el botón, se imprime una suma, resta, división y multiplicación entre ambos números-->
    <form id="operaciones-form">
        <label for="numero1">Número 1:</label>
        <input type="number" id="numero1" name="numero1">
        <br>
        <label for="numero2">Número 2:</label>
        <input type="number" id="numero2" name="numero2">
        <br>
        <button type="submit" onclick="event.preventDefault(); realizarOperaciones();">Realizar Operaciones</button>
    </form>

    <div id="resultado"></div>

    <script>
        function realizarOperaciones() {
            const numero1 = parseFloat(document.getElementById('numero1').value);
            const numero2 = parseFloat(document.getElementById('numero2').value);
            const resultadoDiv = document.getElementById('resultado');

            const suma = numero1 + numero2;
            const resta = numero1 - numero2;
            const division = numero1 / numero2;
            const multiplicacion = numero1 * numero2;
            const sumaTotales = suma + resta + division + multiplicacion;

            resultadoDiv.innerHTML = `
                <p>Suma: ${suma}</p>
                <p>Resta: ${resta}</p>
                <p>División: ${division}</p>
                <p>Multiplicación: ${multiplicacion}</p>
                <p>Suma de todos los resultados: ${sumaTotales}</p>
            `;
        }
    </script>
</body>
</html>
