<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio DOM 1</title>
</head>
<body>
    
    <!-- Formulario: Palabra, Cuántas veces y botón repetir-->
     <form id="repetir-form">
        <label for="palabra">Palabra:</label>
        <input type="text" id="palabra" name="palabra" required>
        <br>
        <label for="veces">Cuántas veces:</label>
        <input type="number" id="veces" name="veces" min="1" required>
        <br>
        <button type="submit" onclick="event.preventDefault(); imprimirResultado();">Repetir</button>
    </form>
    
    <div id="resultado"></div>

<script>



    // función para imprimir el resultado en el div, la cantidad de veces introducidas en el input "veces"
    function imprimirResultado() {

        const palabra = document.getElementById('palabra').value; 
        const veces = parseInt(document.getElementById('veces').value); 
        const resultadoDiv = document.getElementById('resultado');


        resultadoDiv.innerHTML = ''; // Limpiar el contenido previo
        for (let i = 0; i < veces; i++) {
            const p = document.createElement('p');
            p.textContent = palabra;
            resultadoDiv.appendChild(p);
        }
    }
</script>


</body>
</html>
